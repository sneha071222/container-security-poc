name: Container Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t container-security-poc:${{ github.sha }} .

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: container-security-poc:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Check Critical and High vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: container-security-poc:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30
